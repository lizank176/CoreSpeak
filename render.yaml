# Blueprint opcional Render.com (plan gratis). Registra cuenta, conecta GitHub,
# escoge este repo y añade en el dashboard las variables JWT_SECRET_KEY, GROQ_API_KEY, etc.
# APP_BASE_URL = https://<nombre-del-servicio>.onrender.com
#
# BD en producción: Aiven MySQL (variables en el dashboard de Render, no en el repo).
# DATABASE_URL con host *.aivencloud.com tiene prioridad sobre USE_SQLITE.

services:
  - type: web
    name: corespeak-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: USE_SQLITE
        value: "false"
      - key: APP_ENV
        value: production
      # Sustituye por la URL real de tu servicio en Render (sin barra final).
      - key: APP_BASE_URL
        sync: false
