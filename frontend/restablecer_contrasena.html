<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreSpeak - Nueva contraseña</title>
  <link rel="icon" type="image/png" href="/ui/img/favicon-corespeak.png?v=3">
  <link rel="shortcut icon" href="/ui/img/favicon-corespeak.png?v=3">
  <link rel="apple-touch-icon" href="/ui/img/favicon-corespeak.png?v=3">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260529t">
    <link rel="stylesheet" href="a11y.css?v=20260602">
</head>
<body class="auth-page">
    <a href="#main-content" class="skip-link">Saltar al contenido</a>
    <div class="gradient-bg d-flex justify-content-center align-items-center min-vh-100">
        <div class="container">
            <div class="row justify-content-center align-items-center">
                <main id="main-content" class="login-card login-card-enhanced shadow-lg p-4 rounded-4 col-12 col-md-8 col-lg-5" tabindex="-1">
                    <div class="text-center mb-3 logo">
                        <a href="inicio_session.html" class="text-decoration-none d-inline-block corespeak-logo-wrap" aria-label="Volver al inicio de sesión de CoreSpeak"><img src="/ui/img/logo.png?v=20260529hq" alt="" class="logo-img corespeak-logo-img"><span class="corespeak-logo-alt" aria-hidden="true">CoreSpeak</span></a>
                    </div>
                    <h1 class="h3 text-center mb-3">Nueva contraseña</h1>
                    <p class="text-muted small mb-3">Elige una contraseña segura (mínimo 8 caracteres, al menos un número y un símbolo).</p>
                    <input type="hidden" id="reset-token" value="">
                    <div id="reset-msg" class="alert py-2 px-3 small mb-3 d-none" role="alert" aria-live="polite"></div>
                    <form id="reset-form" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="reset-password">Nueva contraseña</label>
                            <input id="reset-password" name="new-password" type="password" class="form-control" autocomplete="new-password" required minlength="8" aria-describedby="reset-password-error">
                            <span id="reset-password-error" class="a11y-field-error d-none" role="alert"></span>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="reset-password2">Repetir contraseña</label>
                            <input id="reset-password2" name="password-confirm" type="password" class="form-control" autocomplete="new-password" required aria-describedby="reset-password2-error">
                            <span id="reset-password2-error" class="a11y-field-error d-none" role="alert"></span>
                        </div>
                        <button id="reset-submit-btn" type="submit" class="btn btn-primary w-100 login-btn iniciar">Guardar contraseña</button>
                    </form>
                    <div class="text-center mt-3 small">
                        <a href="inicio_session.html" class="auth-secondary-link">Ir al inicio de sesión</a>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="a11y.js?v=20260602"></script>
    <script src="app.js?v=20260529j"></script>
</body>
</html>
