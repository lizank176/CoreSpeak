<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreSpeak - Nueva contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="gradient-bg d-flex justify-content-center align-items-center min-vh-100">
        <div class="container">
            <div class="row justify-content-center align-items-center">
                <div class="login-card shadow-lg p-4 rounded-4 col-12 col-md-8 col-lg-5">
                    <div class="text-center mb-3 logo">
                        <a href="inicio_session.html" class="text-decoration-none d-inline-block"><img src="img/logo.png" alt="CoreSpeak" class="logo-img"></a>
                    </div>
                    <h3 class="text-center mb-3">Nueva contraseña</h3>
                    <p class="text-muted small mb-3">Elige una contraseña segura (mínimo 8 caracteres, al menos un número y un símbolo).</p>
                    <input type="hidden" id="reset-token" value="">
                    <div id="reset-msg" class="alert py-2 px-3 small mb-3 d-none" role="alert"></div>
                    <div class="mb-3">
                        <label class="form-label" for="reset-password">Nueva contraseña</label>
                        <input id="reset-password" type="password" class="form-control" autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="reset-password2">Repetir contraseña</label>
                        <input id="reset-password2" type="password" class="form-control" autocomplete="new-password">
                    </div>
                    <button id="reset-submit-btn" type="button" class="btn btn-primary w-100">Guardar contraseña</button>
                    <div class="text-center mt-3 small">
                        <a href="inicio_session.html">Ir al inicio de sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
