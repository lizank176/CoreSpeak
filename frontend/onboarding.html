<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreSpeak — Bienvenida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="onboarding-page">
    <div class="onboarding-bg min-vh-100 py-4 py-md-5 d-flex align-items-center">
        <div class="container px-3">
            <div class="onboarding-card mx-auto">
                <header class="onboarding-header text-center mb-4 pb-3 border-bottom border-light">
                    <p class="onboarding-brand mb-2"><a href="dashboard.html" class="text-decoration-none text-reset">CoreSpeak</a></p>
                    <h1 class="onboarding-title h3 mb-2 fw-bold" data-i18n="onboarding.title">Bienvenida</h1>
                    <p class="onboarding-lead text-muted mb-0 small" data-i18n="onboarding.lead">
                        Tu curso principal es <strong>inglés</strong>. Personalizamos el contenido con tus datos.
                    </p>
                </header>

                <section class="mb-4">
                    <label class="onboarding-label" for="onb-ocupacion">
                        <span class="onboarding-label-icon" aria-hidden="true">◎</span>
                        <span>¿A qué te dedicas? (opcional)</span>
                    </label>
                    <input id="onb-ocupacion" type="text" class="form-control onboarding-input"
                        placeholder="Ej.: estudiante, enfermería, marketing…"
                        autocomplete="organization-title">
                </section>

                <section class="mb-4">
                    <label class="onboarding-label d-block mb-2" for="lvl-en">
                        <span class="onboarding-label-icon" aria-hidden="true">▤</span>
                        <span>Tu nivel de inglés aproximado (opcional)</span>
                    </label>
                    <p class="small text-muted mb-2">Marco CEFR; puedes cambiarlo más adelante.</p>
                    <select id="lvl-en" class="form-select onboarding-select">
                        <option value="">—</option>
                        <option>A1</option>
                        <option>A2</option>
                        <option>B1</option>
                        <option>B2</option>
                        <option>C1</option>
                    </select>
                </section>

                <div id="onboarding-msg" class="alert py-2 px-3 small mb-3 d-none" role="status" aria-live="polite"></div>
                <button id="onboarding-save-btn" type="button" class="btn onboarding-submit w-100 py-3 fw-semibold" data-i18n="onboarding.save">
                    Guardar y continuar
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
