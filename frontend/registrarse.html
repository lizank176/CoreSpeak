<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreSpeak - Crear cuenta</title>
  <link rel="icon" type="image/png" href="/ui/img/favicon-corespeak.png?v=3">
  <link rel="shortcut icon" href="/ui/img/favicon-corespeak.png?v=3">
  <link rel="apple-touch-icon" href="/ui/img/favicon-corespeak.png?v=3">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260529t">
    <link rel="stylesheet" href="a11y.css">

</head>
<body class="auth-page">

    <a href="#main-content" class="skip-link">Saltar al contenido</a>

    <div class="gradient-bg min-vh-100 d-flex justify-content-center align-items-start ">

        <div class="container mt-4">
            <a href="inicio_session.html" class="back-arrow auth-back-btn d-flex align-items-center col-12 col-md-8 col-lg-6 mx-auto mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22"
                    class="auth-back-icon" aria-hidden="true">
                    <circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="1.35"/>
                    <path d="M12.9 7.2L9.2 11l3.7 3.8" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="ms-1" data-i18n="register.back">Volver</span>
            </a>
            <div class="row justify-content-center">
                
                <main id="main-content" class="login-card login-card-enhanced registrar shadow-lg p-4 rounded-4 col-12 col-md-8 col-lg-6" tabindex="-1">

                    <div class="text-center mb-2 logo">
                        <a href="dashboard.html" class="text-decoration-none d-inline-block" aria-label="Ir al inicio de CoreSpeak"><img src="/ui/img/logo.png?v=20260529hq" alt="" class="logo-img"><span class="corespeak-brand-fallback corespeak-brand-fallback--hidden" aria-hidden="true">CoreSpeak</span></a>
                    </div>

                    <h1 class="h3 text-center mb-2" data-i18n="register.title">Crear cuenta</h1>
                    <p class="text-center text-muted mb-4" data-i18n="register.lead">
                        Únete a CoreSpeak y comienza tu viaje de aprendizaje
                    </p>
                    <div id="register-error" class="alert alert-danger py-2 px-3 small mb-3 d-none" role="alert" aria-live="assertive"></div>

                    <form id="register-form" novalidate>

                        <fieldset class="border-0 p-0 m-0 mb-3">
                            <legend class="form-label fw-semibold mb-3">Datos personales</legend>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="register-nombre" data-i18n="register.name">Nombre</label>
                                    <input id="register-nombre" name="given-name" type="text" class="form-control" placeholder="Juan" autocomplete="given-name" required aria-describedby="register-nombre-error">
                                    <span id="register-nombre-error" class="a11y-field-error d-none" role="alert"></span>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="register-apellido" data-i18n="register.surname">Apellido</label>
                                    <input id="register-apellido" name="family-name" type="text" class="form-control" placeholder="Pérez" autocomplete="family-name" aria-describedby="register-apellido-error">
                                    <span id="register-apellido-error" class="a11y-field-error d-none" role="alert"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="register-birth" data-i18n="register.birth">Fecha de nacimiento</label>
                                <input id="register-birth" name="bday" type="date" class="form-control" autocomplete="bday">
                            </div>
                        </fieldset>

                        <div class="mb-3">
                            <label class="form-label" for="register-email" data-i18n="register.email">Correo electrónico</label>
                            <input id="register-email" name="email" type="email" class="form-control" data-i18n-placeholder="login.phEmail" placeholder="tu@email.com" autocomplete="email" required aria-describedby="register-email-error">
                            <span id="register-email-error" class="a11y-field-error d-none" role="alert"></span>
                        </div>

                        <fieldset class="border-0 p-0 m-0 mb-3">
                            <legend class="form-label fw-semibold mb-3">Contraseña</legend>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="register-password" data-i18n="register.password">Contraseña</label>
                                    <div class="input-group">
                                        <input id="register-password" name="new-password" type="password" class="form-control" placeholder="••••••••" autocomplete="new-password" required minlength="8" aria-describedby="register-password-error register-password-hint">
                                        <button id="toggle-register-password" class="btn btn-outline-secondary password-visibility-btn" type="button" aria-label="Mostrar contraseñas" title="Mostrar contraseñas">
                                            <img src="img/eye-closed.svg" alt="" class="password-eye-icon" width="22" height="14" aria-hidden="true">
                                        </button>
                                    </div>
                                    <span id="register-password-hint" class="form-text text-muted small">Mínimo 8 caracteres, con número y símbolo.</span>
                                    <span id="register-password-error" class="a11y-field-error d-none" role="alert"></span>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="register-password-confirm" data-i18n="register.confirm">Confirmar contraseña</label>
                                    <div class="input-group">
                                        <input id="register-password-confirm" name="password-confirm" type="password" class="form-control" placeholder="••••••••" autocomplete="new-password" required aria-describedby="register-password-confirm-error">
                                        <button id="toggle-register-password-confirm" class="btn btn-outline-secondary password-visibility-btn" type="button" aria-label="Mostrar confirmación de contraseña" title="Mostrar confirmación de contraseña">
                                            <img src="img/eye-closed.svg" alt="" class="password-eye-icon" width="22" height="14" aria-hidden="true">
                                        </button>
                                    </div>
                                    <span id="register-password-confirm-error" class="a11y-field-error d-none" role="alert"></span>
                                </div>
                            </div>
                        </fieldset>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="register-consent" required aria-describedby="register-consent-error">
                            <label class="form-check-label small" for="register-consent">
                                Acepto los términos, política de privacidad y tratamiento de datos (RGPD).
                            </label>
                            <span id="register-consent-error" class="a11y-field-error d-none" role="alert"></span>
                        </div>

                        <button id="register-btn" type="submit" class="btn btn-primary w-100 login-btn" data-i18n="register.submit">
                            Crear cuenta
                        </button>

                        <p class="text-center small mt-3 text-muted" data-i18n="register.terms">
                            Al registrarte, aceptas nuestros términos de servicio y política de privacidad
                        </p>

                    </form>

                    <div class="text-center mt-2 small">
                        <span data-i18n="register.hasAccount">¿Ya tienes cuenta?</span>
                        <a href="inicio_session.html" class="register-link"><span data-i18n="register.loginLink">Inicia sesión aquí</span></a>
                    </div>

                </main>
            </div>
        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="a11y.js?v=20260531"></script>
<script src="app.js?v=20260529j"></script>
</body>
</html>
