<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreSpeak - Recuperar contraseña</title>
  <link rel="icon" type="image/png" href="/ui/img/favicon-corespeak.png?v=3">
  <link rel="shortcut icon" href="/ui/img/favicon-corespeak.png?v=3">
  <link rel="apple-touch-icon" href="/ui/img/favicon-corespeak.png?v=3">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260529t">
    <link rel="stylesheet" href="a11y.css">
</head>
<body class="auth-page">
    <a href="#main-content" class="skip-link">Saltar al contenido</a>
    <div class="gradient-bg d-flex justify-content-center align-items-center min-vh-100">
        <div class="container">
            <div class="row justify-content-center align-items-center">
                <main id="main-content" class="login-card login-card-enhanced shadow-lg p-4 rounded-4 col-12 col-md-8 col-lg-5" tabindex="-1">
                    <div class="text-center mb-3 logo">
                        <a href="inicio_session.html" class="text-decoration-none d-inline-block"><img src="img/logo.png?v=20260529hq" alt="CoreSpeak" class="logo-img"></a>
                    </div>
                    <h1 class="h3 text-center mb-3">Recuperar contraseña</h1>
                    <p class="text-center text-muted small mb-4">Introduce el correo con el que te registraste. Si existe una cuenta, te enviaremos un enlace (revisa también spam).</p>
                    <div id="forgot-msg" class="alert py-2 px-3 small mb-3 d-none" role="alert" aria-live="polite"></div>
                    <form id="forgot-form" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="forgot-email">Correo electrónico</label>
                            <input id="forgot-email" name="email" type="email" class="form-control" placeholder="tu@email.com" autocomplete="email" required aria-describedby="forgot-email-error">
                            <span id="forgot-email-error" class="a11y-field-error d-none" role="alert"></span>
                        </div>
                        <button id="forgot-submit-btn" type="submit" class="btn btn-primary w-100 login-btn iniciar">Enviar enlace</button>
                    </form>
                    <div class="text-center mt-3 small">
                        <a href="inicio_session.html" class="auth-secondary-link">Volver a iniciar sesión</a>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="a11y.js"></script>
    <script src="app.js?v=20260529j"></script>
</body>
</html>
