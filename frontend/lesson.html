<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreSpeak - Lesson</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="container-fluid p-0">
        <div class="dashboard-header">
            <div class="container-fluid">
                <nav class="dashboard-nav d-flex">
                    <div class="col-md-1 col-lg-3">
                        <a href="dashboard.html" class="text-decoration-none"><img src="img/logo.png" alt="CoreSpeak Logo" class="dashboard-logo"></a>
                    </div>
                    <div class="col-md-9 col-lg-8">
                        <ul class="dashboard-nav-list d-flex justify-content-end align-items-center h-100">
                            <li class="dashboard-nav-item">
                                <a href="dashboard.html" class="dashboard-nav-link" id="lesson-back-link" data-i18n="back">Volver</a>
                            </li>
                        </ul>
                    </div>
                </nav>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
            <div>
                <h3 id="lesson-title">Lesson</h3>
                <p class="text-muted" id="lesson-meta-line"></p>
            </div>
            <div id="lesson-admin-actions" class="d-none">
                <div class="d-flex flex-wrap gap-2 justify-content-md-end">
                    <a id="lesson-edit-btn" href="admin.html" class="btn btn-outline-primary btn-sm">Editar</a>
                    <button id="lesson-delete-btn" type="button" class="btn btn-outline-danger btn-sm">Borrar</button>
                </div>
                <p id="lesson-admin-msg" class="small mt-2 mb-0 d-none" role="status" aria-live="polite"></p>
            </div>
        </div>

        <div class="row g-4 mt-2" id="lesson-skills-list"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
