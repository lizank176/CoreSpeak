<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreSpeak - Tu perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="gradient-bg min-vh-100 d-flex justify-content-center align-items-start">
        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="login-card registrar shadow-lg p-4 rounded-4 col-12 col-md-8 col-lg-6">
                    <div class="text-center mb-3 logo">
                        <img src="img/logo.png" alt="CoreSpeak" class="logo-img">
                    </div>
                    <h3 class="text-center mb-2">Personaliza tu experiencia</h3>
                    <p class="text-center text-muted mb-2 small">
                        Todos aprenden <strong>inglés</strong> en CoreSpeak. Con <strong>Premium</strong> podrás añadir
                        más idiomas desde Ajustes cuando quieras.
                    </p>
                    <p class="text-center text-muted small mb-3">
                        El <strong>nivel de inglés</strong> que elijas se usa para el <strong>reto diario</strong> y el contenido a tu medida.
                    </p>
                    <div id="profile-setup-error" class="alert alert-danger py-2 px-3 small mb-3 d-none" role="alert"></div>

                    <form id="profile-setup-form">
                        <div class="mb-3">
                            <label class="form-label" for="setup-english-level">Tu nivel de inglés (MCER / CEFR)</label>
                            <select id="setup-english-level" class="form-select" required>
                                <option value="A1">A1 — principiante</option>
                                <option value="A2">A2 — básico</option>
                                <option value="B1">B1 — intermedio bajo</option>
                                <option value="B2">B2 — intermedio alto</option>
                                <option value="C1">C1 — avanzado</option>
                                <option value="C2">C2 — competente / nativo</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="setup-idioma-ui">Idioma de la interfaz</label>
                            <select id="setup-idioma-ui" class="form-select">
                                <option value="es">Español</option>
                                <option value="en">English</option>
                                <option value="fr">Français</option>
                                <option value="uk">Українська</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label d-block mb-2">Centros de interés</label>
                            <div id="setup-interests-grid" class="row g-2" role="group" aria-label="Intereses"></div>
                            <p class="text-muted small mt-2 mb-0" id="setup-interests-msg" role="status"></p>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="setup-wants-premium">
                            <label class="form-check-label" for="setup-wants-premium">
                                Quiero hacerme <strong>Premium</strong> (te llevaremos a los planes; el pago es aparte)
                            </label>
                        </div>
                        <button id="profile-setup-btn" type="button" class="btn btn-primary w-100 login-btn">
                            Guardar y continuar
                        </button>
                    </form>

                    <p class="text-center small mt-3 mb-0 text-muted">
                        ¿Problemas para guardar o vienes de otro dispositivo?
                        <a href="inicio_session.html" class="register-link d-inline">Iniciar sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
